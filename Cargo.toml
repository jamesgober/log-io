[package]
name = "log-io"
version = "0.10.0"
edition = "2021"
rust-version = "1.75"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Structured logging pipeline for Rust. Zero-allocation fast path, JSON / logfmt / human-readable outputs, context propagation (request-id, trace-id), per-module filtering, async-safe sinks. An IO pipeline for log records, not a wrapper around log+tracing."

keywords = [
    "logging",
    "structured",
    "json",
    "logfmt",
    "telemetry"
]

categories = [
    "development-tools::debugging",
    "asynchronous",
    "no-std"
]

documentation = "https://docs.rs/log-io"
repository    = "https://github.com/jamesgober/log-io"
homepage      = "https://github.com/jamesgober/log-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace]
exclude = ["fuzz"]

[features]
default = ["std", "json", "logfmt", "human"]
std = []
json = []
logfmt = []
human = []

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "format"
harness = false
required-features = ["std", "json", "logfmt", "human"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["std", "json", "logfmt"]

[[bench]]
name = "concurrent"
harness = false
required-features = ["std", "json"]

[[example]]
name = "basic"
required-features = ["std", "human"]

[[example]]
name = "json"
required-features = ["std", "json"]

[[example]]
name = "context"
required-features = ["std", "logfmt"]

[[example]]
name = "filter"
required-features = ["std", "human"]

[[example]]
name = "file_sink"
required-features = ["std", "json"]

[[example]]
name = "multi_sink"
required-features = ["std", "json", "human"]

[[example]]
name = "custom_format"
required-features = ["std"]

[[example]]
name = "custom_sink"
required-features = ["std", "json"]

[[example]]
name = "default_fields"
required-features = ["std", "json"]

[[test]]
name = "end_to_end"
required-features = ["std", "json", "logfmt", "human"]

[[test]]
name = "stress"
required-features = ["std", "json", "logfmt", "human"]

[[test]]
name = "property"
required-features = ["std", "json", "logfmt", "human"]

