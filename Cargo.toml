[package]
name = "log-io"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
readme = "README.md"
license = "Apache-2.0"

authors = [
    "James Gober <me@jamesgober.com>"
]

description = "Structured logging pipeline for Rust: filter, format, sink. Allocation-free hot path, JSON / logfmt / human output that is safe for any input, thread and async context propagation, per-target filtering, durable shutdown, background and rotating file sinks, plus optional log and tracing bridges."

keywords = [
    "logging",
    "structured",
    "json",
    "logfmt",
    "telemetry"
]

categories = [
    "development-tools::debugging",
    "no-std"
]

documentation = "https://docs.rs/log-io"
repository    = "https://github.com/jamesgober/log-io"
homepage      = "https://github.com/jamesgober/log-io"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Optional integrations, each behind its own non-default feature. The
# default build has zero dependencies.
#
# `log`: the de-facto logging facade; `LogBridge` implements `log::Log`.
log = { version = "0.4.21", optional = true, default-features = false, features = ["std", "kv"] }
# `tracing-core` + `tracing-subscriber`: `TracingLayer` implements
# `tracing_subscriber::Layer`. Only their `std` features are enabled;
# applications bring the span registry (`tracing-subscriber/registry`).
tracing-core = { version = "0.1.32", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.18", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
# Validates JSON output in tests (every record must parse). The
# `float_roundtrip` feature makes its float parser exact, so tests can
# check that every f64 survives a write/parse cycle bit for bit.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Drive the `tracing` bridge in tests and examples.
tracing = { version = "0.1.40", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.18", default-features = false, features = ["std", "registry"] }
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[workspace]
exclude = ["fuzz"]

[features]
default = ["std", "json", "logfmt", "human"]
std = []
json = []
logfmt = []
human = []
log = ["std", "dep:log"]
tracing = ["std", "dep:tracing-core", "dep:tracing-subscriber"]

[profile.release]
opt-level = 3
lto = "thin"

[[bench]]
name = "format"
harness = false
required-features = ["std", "json", "logfmt", "human"]

[[bench]]
name = "pipeline"
harness = false
required-features = ["std", "json", "logfmt"]

[[bench]]
name = "concurrent"
harness = false
required-features = ["std", "json"]

[[example]]
name = "01_quick_start"
required-features = ["std", "human"]

[[example]]
name = "02_macros"
required-features = ["std", "json"]

[[example]]
name = "03_context"
required-features = ["std", "logfmt"]

[[example]]
name = "04_filter"
required-features = ["std", "human"]

[[example]]
name = "05_file_sink"
required-features = ["std", "json"]

[[example]]
name = "06_multi_sink"
required-features = ["std", "json", "human"]

[[example]]
name = "07_default_fields_and_redaction"
required-features = ["std", "json"]

[[example]]
name = "08_custom_format"
required-features = ["std", "json"]

[[example]]
name = "09_custom_sink"
required-features = ["std", "json"]

[[example]]
name = "10_non_blocking"
required-features = ["std", "json"]

[[example]]
name = "11_log_bridge"
required-features = ["log", "logfmt"]

[[example]]
name = "12_tracing_layer"
required-features = ["tracing", "json"]

[[test]]
name = "end_to_end"
required-features = ["std", "json", "logfmt", "human"]

[[test]]
name = "stress"
required-features = ["std", "json", "logfmt", "human"]

[[test]]
name = "property"
required-features = ["std", "json", "logfmt", "human"]


[[test]]
name = "alloc"
required-features = ["std", "json", "logfmt", "human"]

[[test]]
name = "regressions"
required-features = ["std", "json", "logfmt", "human"]

[[test]]
name = "durability"
required-features = ["std", "json"]

[[test]]
name = "global"
required-features = ["std", "logfmt"]
