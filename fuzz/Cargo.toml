[package]
name = "log-io-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[lib]
path = "src/lib.rs"

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
log-io = { path = ".." }
serde_json = { version = "1", features = ["float_roundtrip"] }

[[bin]]
name = "filter_directive"
path = "fuzz_targets/filter_directive.rs"
test = false
doc = false

[[bin]]
name = "level_parse"
path = "fuzz_targets/level_parse.rs"
test = false
doc = false

[[bin]]
name = "json_format"
path = "fuzz_targets/json_format.rs"
test = false
doc = false

[[bin]]
name = "logfmt_format"
path = "fuzz_targets/logfmt_format.rs"
test = false
doc = false

[[bin]]
name = "human_format"
path = "fuzz_targets/human_format.rs"
test = false
doc = false

[[bin]]
name = "logger_pipeline"
path = "fuzz_targets/logger_pipeline.rs"
test = false
doc = false

[workspace]
members = ["."]
